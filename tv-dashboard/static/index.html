<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KR AUEN TV</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <header class="topbar">
    <div class="logo"><img src="abb-logo.png" alt="ABB"></div>
    <h1 id="page-title">KR AUEN PROJECT OVERVIEW</h1>
    <div class="topbar-right">
      <div class="hdr-date"><span id="hdr-date"></span><b id="hdr-time"></b></div>
      <div class="hdr-weather" id="hdr-weather"></div>
    </div>
  </header>

  <!-- ───────── 1. 프로젝트 지도 ───────── -->
  <section class="page" id="page-map">
    <div class="map-heading">
      <h2>프로젝트 지도</h2>
      <span id="map-sub">진행 중이거나 예정된 프로젝트 · 현장 위치 기준</span>
      <span class="last-update" id="last-update"></span>
    </div>
    <ul class="legend">
      <li><i class="c-imminent"></i>2주 내 임박</li>
      <li><i class="c-site"></i>현장작업</li>
      <li><i class="c-fat"></i>FAT</li>
      <li><i class="c-abb"></i>ABB Work</li>
      <li><i class="c-annual"></i>연간 계약</li>
    </ul>
    <svg id="map-svg" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    <div id="map-cards"></div>
    <div id="map-memo"><span class="memo-tag" id="memo-tag"></span><p id="memo-text"></p></div>
    <div id="map-error" class="error-banner" hidden></div>
  </section>

  <!-- ───────── 2. 기존 디자인 (page2.html) ───────── -->
  <section class="page" id="page-legacy">
    <iframe id="legacy-frame" title="기존 화면" scrolling="no"></iframe>
  </section>

  <!-- ───────── 3. 사내소식 · 식단 ───────── -->
  <section class="page" id="page-info">
    <div class="info-col">
      <article class="panel" id="p-notice">
        <header><h3>사내 공지</h3><span class="tag">전체공지 메일</span><span class="count" id="notice-count"></span></header>
        <div class="body" id="notice-body"></div>
      </article>
      <article class="panel" id="p-abb">
        <header><h3>ABB 코리아 소식</h3><span class="src">new.abb.com/kr</span></header>
        <ul class="news" id="abb-news"></ul>
      </article>
    </div>
    <div class="info-col">
      <article class="panel" id="p-menu-daily">
        <header><h3>오늘 식단</h3><span class="src" id="menu-daily-date"></span></header>
        <div class="menu-img" id="menu-daily"></div>
      </article>
      <article class="panel" id="p-menu-weekly">
        <header><h3>주간 식단</h3><span class="src" id="menu-weekly-date"></span></header>
        <div class="menu-img" id="menu-weekly"></div>
      </article>
    </div>
  </section>

  <!-- ───────── 하단 바: 경제뉴스 · 주가 (모든 페이지) ───────── -->
  <footer class="bottombar">
    <span class="bb-tag">경제</span>
    <div class="bb-news" id="econ-ticker"></div>
    <div class="bb-stocks" id="stocks"></div>
    <nav class="dots" id="dots"></nav>
  </footer>
</div>

<script src="korea-map.js"></script>
<script src="schedule-logic.js"></script>
<script src="app.js"></script>
</body>
</html>
